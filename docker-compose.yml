version: "3.9"

services:

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_pass
      POSTGRES_DB: cinema_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres

  backend:
    image: ghcr.io/nonncal/film-react-nest/backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://cinema_user:cinema_pass@postgres:5432/cinema_db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: cinema_user
      DATABASE_PASSWORD: cinema_pass
      DATABASE_NAME: cinema_db
    networks:
      - postgres
      - nginx

  frontend:
    image: ghcr.io/nonncal/film-react-nest/frontend:latest
    networks:
      - nginx

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nginx
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - postgres

networks:
  nginx:
  postgres:

volumes:
  postgres_data:
  pgadmin: