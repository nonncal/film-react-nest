version: "3.9"

services:

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_pass
      POSTGRES_DB: cinema_db
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - postgres

  backend:
    image: ghcr.io/nonncal/film-react-nest/backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    networks:
      - postgres
      - nginx

  frontend:
    image: ghcr.io/nonncal/film-react-nest/frontend:latest
    volumes:
      - frontend:/app/dist
    networks:
      - nginx

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - nginx
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - postgres
    restart: unless-stopped

networks:
  nginx:
  postgres:

volumes:
  pg-data:
  frontend:
  pgadmin: